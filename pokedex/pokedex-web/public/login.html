<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pokédex TCG · Acceso</title>
<style>
:root{
  --red-700:#a8202c; --red-600:#c62b33; --red-800:#7d1620;
  --steel-900:#0c1016; --steel-800:#141a23; --steel-700:#1d2530;
  --steel-600:#2a3543; --txt:#e8eef5; --txt-dim:#93a3b5; --lcd:#7dfcb0;
  --font:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  font-family:var(--font);color:var(--txt);
  background:radial-gradient(900px 500px at 20% -10%,#2a3240,transparent 60%),
             radial-gradient(800px 450px at 100% 0,#3a1c22,transparent 55%),var(--steel-900);
}
.box{width:100%;max-width:390px}
.hood{
  background:linear-gradient(175deg,var(--red-600),var(--red-800));
  border-radius:14px 14px 6px 6px;border:1px solid rgba(0,0,0,.45);
  box-shadow:0 18px 45px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.22);
  padding:20px;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden;
}
.hood::after{content:"";position:absolute;inset:0;
  background:linear-gradient(105deg,rgba(255,255,255,.10) 0 38%,transparent 38.5%);pointer-events:none}
.lens{
  width:52px;height:52px;border-radius:50%;flex:0 0 auto;border:4px solid #f2f4f7;
  background:radial-gradient(circle at 32% 28%,#dff3ff 0 8%,#74c8ff 22%,#2f7ce0 55%,#103a72 100%);
  box-shadow:0 0 0 3px rgba(0,0,0,.35),0 0 22px rgba(90,217,255,.5),inset -4px -6px 12px rgba(0,0,0,.35);
}
.hood h1{margin:0;font-size:17px;letter-spacing:.15em;text-transform:uppercase}
.hood p{margin:3px 0 0;font-size:10.5px;letter-spacing:.26em;color:#ffe0e0;opacity:.85}
form{
  background:linear-gradient(180deg,var(--steel-700),var(--steel-800));
  border:1px solid rgba(255,255,255,.08);border-top:none;border-radius:0 0 14px 14px;
  padding:24px 22px 26px;box-shadow:0 18px 45px rgba(0,0,0,.5);
}
label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-dim);margin-bottom:6px}
input{
  width:100%;background:var(--steel-900);border:1px solid var(--steel-600);border-radius:9px;
  padding:12px 13px;color:var(--lcd);font-family:var(--mono);font-size:14px;outline:none;margin-bottom:16px;
}
input:focus{border-color:rgba(125,252,176,.55);box-shadow:0 0 0 3px rgba(125,252,176,.10)}
button{
  width:100%;background:linear-gradient(180deg,var(--red-600),var(--red-700));color:#fff;
  border:1px solid rgba(0,0,0,.4);border-radius:9px;padding:13px;font-size:14px;font-weight:700;
  letter-spacing:.05em;cursor:pointer;font-family:inherit;
}
button:hover{filter:brightness(1.08)}
button:disabled{opacity:.55;cursor:default}
.msg{
  margin:14px 0 0;font-size:12.5px;line-height:1.5;min-height:18px;text-align:center;
}
.msg.err{color:#ff9b9b}
.foot{margin-top:16px;text-align:center;font-size:11px;color:var(--txt-dim)}
</style>
</head>
<body>
<div class="box">
  <div class="hood">
    <div class="lens"></div>
    <div>
      <h1>Pokédex TCG</h1>
      <p>Acceso privado</p>
    </div>
  </div>
  <form id="f" autocomplete="on">
    <label for="u">Usuario</label>
    <input id="u" name="username" autocomplete="username" required autofocus>
    <label for="p">Contraseña</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button id="b" type="submit">Entrar</button>
    <p class="msg" id="m"></p>
  </form>
  <p class="foot">Colección personal · no indexada</p>
</div>

<script>
const f = document.getElementById("f"), b = document.getElementById("b"), m = document.getElementById("m");
f.addEventListener("submit", async e => {
  e.preventDefault();
  b.disabled = true; m.className = "msg"; m.textContent = "Verificando…";
  try{
    // Ruta relativa: funciona igual en /pokedex/login que en cualquier otra base
    const r = await fetch("api/login", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      credentials: "same-origin",
      body: JSON.stringify({
        username: document.getElementById("u").value,
        password: document.getElementById("p").value,
      }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "No se pudo iniciar sesión");
    m.textContent = "Correcto, entrando…";
    location.href = "./";
  }catch(err){
    m.className = "msg err";
    m.textContent = err.message;
    document.getElementById("p").value = "";
    b.disabled = false;
  }
});
</script>
</body>
</html>
